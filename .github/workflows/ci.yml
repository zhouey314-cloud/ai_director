name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q ai_director.py modules pr_agent
